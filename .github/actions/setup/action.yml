name: Setup JShark toolchain
description: Install the shared toolchain and generate static assets.

runs:
  using: composite
  steps:
    - name: Install LLVM 20
      shell: bash
      run: |
        # dl.google.com's apt repo is flaky on hosted runners (Hash Sum
        # mismatch); CI never needs Chrome, so drop it before updating.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y llvm-20

    - uses: oven-sh/setup-bun@v2

    - name: Install Biome
      shell: bash
      run: bun install -g @biomejs/biome@2.5.11

    - uses: haskell-actions/setup@v2
      id: haskell
      with:
        ghc-version: "9.14.1"
        cabal-version: "3.12"

    - uses: actions/cache@v4
      with:
        path: ${{ steps.haskell.outputs.cabal-store }}
        key: ${{ runner.os }}-ghc-9.14.1-${{ hashFiles('**/*.cabal', 'cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-ghc-9.14.1-

    - name: Update package index
      shell: bash
      run: cabal update

    - name: Static assets
      shell: bash
      run: |
        ./scripts/vendor-speed-highlight.sh
        ./scripts/gen-synth-keys-css.sh
        ./scripts/gen-life-tool-preview-css.sh
