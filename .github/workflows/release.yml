name: Release

# Cut a release by pushing a tag like `v0.1.0.0`. The tag must match every
# published package's cabal version. Everything is built and tested from the
# unpacked source distributions before anything is uploaded, and only the
# tarballs that passed verification are published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 20
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y llvm-20

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - uses: oven-sh/setup-bun@v2

      - name: Install Biome
        run: bun install -g @biomejs/biome@2.5.11

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: "9.14.1"
          cabal-version: "3.12"

      - run: cabal update

      - name: Tag and package versions agree
        if: github.ref_type == 'tag'
        run: ./scripts/check-tag-version.sh "$GITHUB_REF_NAME"

      # Builds/tests the unpacked sdists outside the monorepo (no root
      # overrides), installs jshark-bindgen, and runs it on a shipped fixture.
      # Leaves the exact verified tarballs in dist-newstyle/sdist.
      - name: Verify source distributions
        run: ./scripts/verify-sdists.sh

      - name: Collect verified tarballs
        id: tarballs
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' packages/jshark/jshark.cabal | head -1 | tr -d '[:space:]')
          paths=""
          for p in jshark jshark-lucid jshark-bindgen jshark-hotreload; do
            t="dist-newstyle/sdist/$p-$version.tar.gz"
            test -f "$t" || { echo "missing verified tarball $t" >&2; exit 1; }
            paths="$paths $t"
          done
          echo "paths=$paths" >> "$GITHUB_OUTPUT"

      - name: Upload verified tarballs artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-sdists
          path: ${{ steps.tarballs.outputs.paths }}

      - name: Publish to Hackage
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
        run: |
          if [ -z "$HACKAGE_TOKEN" ]; then
            echo "HACKAGE_TOKEN is not set; skipping Hackage upload."
            exit 0
          fi
          # jshark first so dependents resolve.
          version=$(sed -n 's/^version:[[:space:]]*//p' packages/jshark/jshark.cabal | head -1 | tr -d '[:space:]')
          for p in jshark jshark-lucid jshark-bindgen jshark-hotreload; do
            cabal upload --publish --token="$HACKAGE_TOKEN" "dist-newstyle/sdist/$p-$version.tar.gz"
          done

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.tarballs.outputs.paths }}
