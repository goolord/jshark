name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Rebuild vendored WASM
        run: ./scripts/check-wasm.sh

      # ghcup has no fourmolu bindist for ubuntu-24.04; the action
      # fetches the GitHub release zip instead. Never block CI on format
      # drift; surface a workflow warning instead.
      - name: Fourmolu (advisory)
        id: fourmolu
        continue-on-error: true
        uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.20.1.0"
          pattern: |
            packages/**/*.hs
            examples/**/*.hs
            scripts/**/*.hs

      - name: Fourmolu advisory notice
        if: steps.fourmolu.outcome != 'success'
        run: |
          echo "::warning title=Fourmolu::Some files are not formatted. Run scripts/format.sh locally."

      - name: Install jshark-bindgen TypeScript deps
        run: bun install
        working-directory: packages/jshark-bindgen

      - name: Test
        run: |
          cabal test all --test-show-details=direct \
            --test-options='+RTS -N1 -M4G -RTS -t120'

      - name: Hackage checks
        run: |
          for p in jshark jshark-lucid jshark-bindgen jshark-hotreload; do
            (cd "packages/$p" && cabal check)
          done

      - name: Source distributions
        run: cabal sdist jshark jshark-lucid jshark-bindgen jshark-hotreload

      - name: Haddock
        run: cabal haddock jshark jshark-lucid jshark-bindgen jshark-hotreload

  pages-build:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Export static site
        run: cabal run exe:jshark-examples -- export _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages-deploy:
    needs: pages-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
